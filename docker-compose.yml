version: '3.8'

services:
  # --- 1. Application (Backend/API) ---
  app:
    build: ./src       # Construit l'image à partir de votre dossier src et du Dockerfile
    container_name: sporttracker_app
    restart: always
    depends_on:
      - db_postgres
      - db_mongo
    environment:
      # Connection Strings (Notez l'utilisation des noms de services comme host)
      DATABASE_URL: postgres://user:password@db_postgres:5432/sportdb
      MONGO_URI: mongodb://db_mongo:27017/sportlogs
    # On n'expose pas de port vers l'extérieur ici, car Nginx va s'en charger.
    # L'app doit juste écouter sur le port 5000 (standard Flask) en interne.

  # --- 2. Serveur Web (Nginx - Reverse Proxy) ---
  nginx:
    image: nginx:alpine
    container_name: sporttracker_nginx
    restart: always
    ports:
      - "80:80"  # C'est le seul port ouvert vers votre machine
    volumes:
      # On injecte le fichier de conf (voir ci-dessous)
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  # --- 3. Base de données Relationnelle (PostgreSQL) ---
  db_postgres:
    image: postgres:15-alpine
    container_name: sporttracker_postgres
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sportdb
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./db_rel/init.sql:/docker-entrypoint-initdb.d/init.sql

  # --- 4. Base de données Non-Relationnelle (MongoDB) ---
  db_mongo:
    image: mongo:6.0
    container_name: sporttracker_mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - ./data/mongo:/data/db
      # Mongo utilise des scripts JS pour l'init
      - ./db_nonrel/config.js:/docker-entrypoint-initdb.d/mongo-init.js