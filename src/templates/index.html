<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportsTracker - Architecture NoSQL</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #ff4757; /* Rouge sportif */
            --dark-bg: #2f3542;
            --darker-bg: #1e272e;
        }

        body {
            font-family: 'Open Sans', sans-serif;
            background-color: var(--dark-bg);
            color: white;
            overflow-x: hidden;
        }

        h1, h2, h3, .navbar-brand {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
        }

        /* NAVBAR */
        .navbar {
            background-color: rgba(30, 39, 46, 0.95);
            backdrop-filter: blur(10px);
        }

        /* HERO SECTION */
        .hero {
            height: 90vh;
            background: linear-gradient(135deg, rgba(0,0,0,0.7), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1517836357463-d25dfeac3438?ixlib=rb-1.2.1&auto=format&fit=crop&w=1950&q=80');
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
        }

        .hero-content h1 {
            font-size: 4rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }

        .hero-content p {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            color: #dfe4ea;
        }

        .btn-cta {
            background-color: var(--primary-color);
            color: white;
            padding: 15px 40px;
            border-radius: 50px;
            font-weight: 700;
            text-transform: uppercase;
            transition: transform 0.3s, box-shadow 0.3s;
            border: none;
        }

        .btn-cta:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(255, 71, 87, 0.4);
            color: white;
        }

        /* TECH STACK SECTION */
        .tech-section {
            background-color: var(--darker-bg);
            padding: 5rem 0;
        }

        .tech-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 2rem;
            transition: all 0.3s;
            height: 100%;
        }

        .tech-card:hover {
            background: rgba(255,255,255,0.1);
            transform: translateY(-10px);
            border-color: var(--primary-color);
        }

        .tech-icon {
            font-size: 3rem;
            margin-bottom: 1.5rem;
            color: var(--primary-color);
        }

        /* FEATURES SECTION */
        .features-section {
            padding: 5rem 0;
            background-color: var(--dark-bg);
        }
        
        .feature-box i {
            color: var(--primary-color);
            margin-bottom: 1rem;
        }

        footer {
            background-color: #000;
            padding: 2rem 0;
            text-align: center;
            font-size: 0.9rem;
            color: #747d8c;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="#"><i class="fas fa-bolt text-danger me-2"></i>SportsTracker</a>
            <div class="ms-auto">
                <a href="/dashboard" class="btn btn-outline-light btn-sm px-4 rounded-pill">Connexion Démo</a>
            </div>
        </div>
    </nav>

    <section class="hero">
        <div class="container hero-content">
            <h1 class="animate-fade-in">Performance <span class="text-danger">&</span> Data</h1>
            <p>Le projet de démonstration d'architecture hybride SQL / NoSQL.</p>
            <a href="/dashboard" class="btn btn-cta">Lancer l'application <i class="fas fa-arrow-right ms-2"></i></a>
        </div>
    </section>
    <footer>
        <div class="container">
            <p>&copy; 2025 SportsTracker</p>
        </div>
    </footer>

</body>
</html>
