<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Inscription - SportsTracker</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    </head>
    <body class="login-page">

        <div class="container d-flex justify-content-center align-items-center min-vh-100 py-5">
            <div class="login-card text-center animate-fade-in">
                <div class="mb-4">
                    <i class="fas fa-running fa-3x text-danger"></i>
                </div>
                <h3 class="mb-2 fw-bold">Rejoignez l'équipe</h3>

                {% if error %}
                <div class="alert alert-danger p-2 small mb-3">
                    <i class="fas fa-exclamation-circle me-1"></i> {{ error }}
                </div>
                {% endif %}

                <form method="POST" action="/register">
                    <div class="form-floating mb-3">
                        <input type="text" name="username" class="form-control" id="regUser" placeholder="Pseudo" required>
                        <label for="regUser">Nom d'utilisateur</label>
                    </div>
                    <div class="form-floating mb-3">
                        <input type="password" name="password" class="form-control" id="regPass" placeholder="Mot de passe" required>
                        <label for="regPass">Mot de passe</label>
                    </div>
                    <div class="form-floating mb-3">
                        <input type="password" name="confirm_password" class="form-control" id="regConfirm" placeholder="Confirmer" required>
                        <label for="regConfirm">Confirmer le mot de passe</label>
                    </div>

                    <button class="btn btn-danger w-100 py-3 fw-bold rounded-pill mb-3" type="submit">
                        CRÉER MON COMPTE <i class="fas fa-user-plus ms-2"></i>
                    </button>
                </form>

                <div class="border-top pt-3 mt-3">
                    <p class="small text-muted mb-0">Déjà un compte ?</p>
                    <a href="/login" class="fw-bold text-decoration-none">Se connecter</a>
                </div>
            </div>
        </div>
    </body>
</html>
