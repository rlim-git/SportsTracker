server {
    listen 80;

    # Rediriger toutes les requêtes vers le service "app"
    location / {
        proxy_pass http://app:5000; # "app" est le nom du service dans le docker-compose
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}